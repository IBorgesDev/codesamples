[tools]
"github:rojo-rbx/rojo" = "7.7.0"
"github:johnnymorganz/stylua" = "2.5.2"
"github:johnnymorganz/luau-lsp" = "1.69.0"

[tasks.serve]
description = "Live sync with Studio on port 34875 (connect from the Rojo plugin)"
run = "rojo serve"

[tasks.build]
description = "Build a place file with the code only"
run = "rojo build -o build/analytics.rbxl"

[tasks.sourcemap]
description = "Sourcemap for luau-lsp"
run = "rojo sourcemap default.project.json -o sourcemap.json"

[tasks.fmt]
description = "Format the Luau code with StyLua"
run = "stylua src"

[tasks.up]
description = "Generate infra/.env if missing and start Redis, ClickHouse, the ingest and the worker"
run = ["node infra/env.mjs", "docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build --wait"]

[tasks.down]
description = "Stop the containers (data is kept)"
run = "docker compose -f infra/docker-compose.yml --env-file infra/.env down"

[tasks.load]
description = "k6 load test against the ingest: gzip batches from simulated servers (SERVERS, FLUSH_SECONDS, EVENTS_PER_FLUSH, DURATION)"
run = "docker compose -f infra/docker-compose.yml --env-file infra/.env --profile load run --rm k6"

[tasks.stress]
description = "Batch rate one ingest instance sustains (RATE batches/s, DURATION, EVENTS_PER_FLUSH)"
run = "docker compose -f infra/docker-compose.yml --env-file infra/.env --profile load run --rm -e RATE -e DURATION -e EVENTS_PER_FLUSH -e VUS k6 /scripts/stress.js"

[tasks.tunnel]
description = "Public HTTPS URL for the ingest, so a Studio playtest can reach it"
run = "docker compose -f infra/docker-compose.yml --env-file infra/.env --profile tunnel up tunnel"
