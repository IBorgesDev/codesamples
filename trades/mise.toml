[tools]
"github:rojo-rbx/rojo" = "7.7.0"
"github:UpliftGames/wally" = "0.3.2"
"github:johnnymorganz/stylua" = "2.5.2"
"github:johnnymorganz/luau-lsp" = "1.69.0"

[tasks.install]
description = "Restore Wally packages"
run = "wally install"

[tasks.serve]
description = "Live sync with Studio on port 34875 (connect from the Rojo plugin)"
run = "rojo serve"

[tasks.build]
description = "Build a place file with the code only"
run = "rojo build -o build/trades.rbxl"

[tasks.sourcemap]
description = "Sourcemap for luau-lsp"
run = "rojo sourcemap default.project.json -o sourcemap.json"

[tasks.fmt]
description = "Format the Luau code with StyLua"
run = "stylua src"
